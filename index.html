<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Generator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='28' height='17' rx='8' fill='%23ffb454'/%3E%3Cpath d='M9 13v7M5.5 16.5h7' stroke='%23231a0b' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='21' cy='14.5' r='2' fill='%23231a0b'/%3E%3Ccircle cx='25' cy='18.5' r='2' fill='%23231a0b'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <h1>Game Generator</h1>
      <span id="model-chip" class="pill">Checking server…</span>
    </header>
    <main class="layout">
      <aside class="sidebar">
        <form id="gen-form" class="composer">
          <div id="remix-banner" class="remix-banner" hidden>
            <span id="remix-label"></span>
            <button id="remix-cancel" type="button">Stop remixing</button>
          </div>
          <label id="prompt-label" for="prompt">Describe a game</label>
          <textarea
            id="prompt"
            rows="3"
            maxlength="2000"
            placeholder="A cozy fishing game where the fish are tiny philosophers"
          ></textarea>
          <div class="row">
            <button id="generate" type="submit" class="primary">Generate</button>
            <span id="gen-note" class="note" role="status" aria-live="polite"></span>
          </div>

          <div id="gen-status-box" class="status-box" hidden role="status" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span>
            <div class="status-text">
              <strong id="gen-phase"></strong>
              <span id="gen-detail"></span>
            </div>
            <button id="gen-cancel" type="button">Cancel</button>
          </div>

          <div id="gen-error" class="alert" role="alert" hidden>
            <div class="alert-body">
              <strong id="gen-error-title">Generation failed</strong>
              <p id="gen-error-text"></p>
            </div>
            <button id="gen-error-close" type="button" class="icon" aria-label="Dismiss error">×</button>
          </div>
        </form>

        <h2 class="section-title">Library</h2>
        <ul id="library" class="library"></ul>
      </aside>

      <section class="stage" aria-labelledby="stage-title">
        <div class="stage-bar">
          <h2 id="stage-title">No game selected</h2>
          <div class="stage-actions">
            <button id="restart" type="button" disabled>Restart</button>
            <button id="fullscreen" type="button" disabled>Fullscreen</button>
          </div>
        </div>
        <div class="stage-fit">
          <div id="stage-frame" class="frame">
            <p class="placeholder">Pick a game from the library, or generate a new one.</p>
          </div>
        </div>
        <p id="stage-error" class="alert compact" role="alert" hidden></p>
      </section>
    </main>
    <script type="module" src="/ui/main.ts"></script>
  </body>
</html>
